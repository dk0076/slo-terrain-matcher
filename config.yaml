# SLO terrain matcher configuration.
#
# Edit the targets below to change what the search looks for; no code changes
# are needed. Grades are percent (rise / run * 100), lengths are statute miles.

area:
  # Bounding box covering San Luis Obispo and surrounding terrain.
  # Order: west, south, east, north (lon/lat, EPSG:4326).
  bbox: [-120.75, 35.15, -120.55, 35.35]
  # Reference point for the "distance from town" bonus: downtown SLO.
  reference_point: [35.2828, -120.6596]  # lat, lon
  name: San Luis Obispo, CA

dem:
  # USGS 3DEP 1/3 arc-second (~10 m) seamless DEM via the TNM Access API.
  tnm_dataset: "National Elevation Dataset (NED) 1/3 arc-second"
  tnm_api: "https://tnmaccess.nationalmap.gov/api/v1/products"
  # Read only the bounding box out of the remote GeoTIFF instead of pulling
  # the whole 1-degree tile (~445 MB each). Set false to download whole tiles.
  windowed_download: true

osm:
  # Overpass mirrors are tried in order with exponential backoff.
  overpass_endpoints:
    - "https://overpass-api.de/api/interpreter"
    - "https://overpass.kumi.systems/api/interpreter"
    - "https://overpass.private.coffee/api/interpreter"
  highway_tags:
    - residential
    - tertiary
    - secondary
    - primary
    - unclassified
    - service
    - living_street
    - cycleway
    - footway
    - path
    - track
  timeout_s: 180
  max_retries: 4

analysis:
  # Elevation sample spacing along each corridor, metres.
  sample_spacing_m: 20.0
  # Rolling-mean window (in samples) applied to elevation before differencing.
  smoothing_samples: 5
  # Hard floor on window length: grade over anything shorter is DEM noise.
  min_window_m: 100.0
  # Sliding-window step, in samples.
  window_step_samples: 2
  # A matched window must be mostly monotonic, so that "continuous" means
  # continuous: elevation change running against the window's overall trend
  # may not exceed this fraction of its net change. Ignored for targets whose
  # grade band straddles zero (the flat finish).
  max_reversal_fraction: 0.25
  # For a target whose band straddles zero (the flat finish), cap total
  # climbing per kilometre instead. Without this a road of steep rollers that
  # ends where it started would count as flat. 20 m/km is about 105 ft/mile.
  max_undulation_m_per_km: 20.0
  # Corridor building: maximum turn angle (degrees) allowed when chaining
  # consecutive OSM edges into one continuous runnable line.
  max_turn_angle_deg: 60.0
  # Bonus to the turn-angle allowance when the street name continues.
  same_name_turn_bonus_deg: 20.0
  # Longest corridor to build, metres. Keeps profiles to a runnable scale.
  max_corridor_m: 12000.0
  # Check loopability for at most this many candidates per target (it runs a
  # shortest-path query per candidate).
  loop_check_limit: 60
  # A segment counts as loopable if a return route exists that avoids the
  # segment itself and is no longer than this multiple of the segment.
  loop_max_ratio: 3.0

scoring:
  # Weights for the quality score (0-100). They need not sum to anything.
  grade_weight: 45.0
  length_weight: 25.0
  paved_bonus: 15.0
  proximity_bonus: 15.0
  # Distance (miles from the reference point) at which the proximity bonus
  # decays to zero.
  proximity_decay_mi: 8.0
  # Penalty applied when a segment is flagged unreliable (bridge/waterway).
  unreliable_penalty: 25.0
  # Penalty when the OSM surface tag says dirt, gravel or similar.
  unpaved_penalty: 20.0

output:
  dir: output
  cache_dir: data
  top_n_report: 10
  top_n_gpx: 3
  top_n_map: 10

# ---------------------------------------------------------------------------
# Targets derived from the Oakland Marathon course.
# ---------------------------------------------------------------------------
targets:
  - key: steep_pitch
    label: Steep pitches
    race_location: miles 3-6
    spec: 0.2-0.5 mi at 4-7% grade, paved, loopable
    length_mi: [0.2, 0.5]
    grade_pct: [4.0, 7.0]
    ideal_grade_pct: 5.5
    require_paved: false
    prefer_paved: true
    want_loopable: true
    color: "#d7191c"

  - key: max_pitch
    label: Max pitch
    race_location: mile 3.0
    spec: short pitch near 6.9%
    length_mi: [0.15, 0.4]
    grade_pct: [6.0, 8.5]
    ideal_grade_pct: 6.9
    require_paved: false
    prefer_paved: true
    want_loopable: true
    color: "#7b0d0d"

  - key: bridge_climb
    label: Bridge climb
    race_location: miles 16-18
    spec: 2-3 mi continuous at 1.0-2.0%
    length_mi: [2.0, 3.2]
    grade_pct: [1.0, 2.0]
    ideal_grade_pct: 1.5
    require_paved: false
    prefer_paved: true
    want_loopable: false
    color: "#2c7bb6"

  - key: bridge_descent
    label: Bridge descent
    race_location: miles 19-21
    spec: 2-3 mi continuous at -1.0 to -1.5%
    length_mi: [2.0, 3.2]
    grade_pct: [-1.6, -0.9]
    ideal_grade_pct: -1.25
    require_paved: false
    prefer_paved: true
    want_loopable: false
    color: "#abd9e9"

  - key: steep_descent
    label: Steep descent
    race_location: mile 6.2
    spec: 0.3+ mi at about -5.1%
    length_mi: [0.3, 1.0]
    grade_pct: [-6.5, -4.0]
    ideal_grade_pct: -5.1
    require_paved: false
    prefer_paved: true
    want_loopable: true
    color: "#fdae61"

  - key: flat_finish
    label: Flat finish
    race_location: miles 22-26
    spec: 4+ mi under 1% either direction
    length_mi: [4.0, 8.0]
    grade_pct: [-1.0, 1.0]
    ideal_grade_pct: 0.0
    require_paved: false
    prefer_paved: true
    want_loopable: false
    color: "#1a9641"

# Optional: the race course GPX, used by course.py to re-measure the targets
# above against the actual course profile.
course_gpx: data/course/oakland-marathon.gpx

# ---------------------------------------------------------------------------
# Whole routes that reproduce the course profile.
#
# These are built by route.py, which grows a route edge by edge through the
# road graph, preferring edges whose grade matches what the course is doing at
# the same fraction of the way through. Set length_mi to 0 to use the course's
# own length.
# ---------------------------------------------------------------------------
routes:
  - key: simulation
    label: Marathon simulation
    length_mi: 0          # 0 means "the same length as the course"
    loop: true
    # 600 beams with 3 per node: a narrower beam collapses onto one street and
    # the match drops sharply (0.30 at 240/2 versus 0.56 at 600/3 on the same
    # terrain). Wider costs roughly twice the search time, which is worth it.
    beam_width: 600
    per_node: 3
    recent_memory: 60     # laps of a flat corridor are expected at this length
    unpaved_penalty: 0.6
    feature_emphasis: 0.6
    color: "#6a3d9a"

  - key: signature_loop
    label: Signature loop
    length_mi: 8.0
    loop: true
    beam_width: 600
    per_node: 3
    recent_memory: 140    # a short loop should not retrace itself
    unpaved_penalty: 0.9
    feature_emphasis: 0.6
    color: "#ff7f00"
