[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain-matcher"
version = "0.3.0"
description = "Replicate a race course's gradient profile on local roads"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Drew King" }]
keywords = ["running", "gpx", "elevation", "dem", "openstreetmap", "training"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Intended Audience :: End Users/Desktop",
]

dependencies = [
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "osmnx>=1.9",
  "numpy>=1.26",
  "pandas>=2.0",
  "networkx>=3.0",
  "folium>=0.15",
  "gpxpy>=1.6",
  "fitdecode>=0.10",
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
web = ["flask>=3.0", "defusedxml>=0.7"]
dev = ["pytest>=8.0", "pyflakes>=3.0"]

[project.urls]
Homepage = "https://github.com/dk0076/slo-terrain-matcher"

[project.scripts]
replicate = "replicate:main"
terrain-matcher = "run:main"

[tool.setuptools]
py-modules = [
  "analyze", "area", "chart", "config", "course", "fetch_data",
  "geo", "replicate", "report", "route", "run", "validate",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --tb=short"
